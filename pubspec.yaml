name: disaster_mesh
description: "DisasterMesh - Offline Emergency Communication System. A mesh network application for off-grid SOS relaying during emergency disasters."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local Offline Storage
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2

  # Android GPS & Location
  geolocator: ^10.1.0
  permission_handler: ^11.3.1

  # Speech-to-Text for Voice Emergency
  speech_to_text: ^6.6.1

  # Google Nearby Connections for P2P Mesh Communication
  nearby_connections: ^4.2.0

  # Helper Utilities & UI
  uuid: ^4.3.3
  intl: ^0.19.0
  flutter_spinkit: 5.2.0
  url_launcher: ^6.2.5
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
